<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus360 - Notices</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
        }

        .header {
            background: #123b70;
            color: white;
            padding: 20px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
        }

        .back {
            background: white;
            color: #123b70;
            padding: 9px 18px;
            border-radius: 7px;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 1000px;
            margin: 35px auto;
            padding: 20px;
        }

        .title {
            margin-bottom: 25px;
        }

        .title h2 {
            color: #123b70;
            margin-bottom: 8px;
        }

        .title p {
            color: #666;
        }

        .notice-card {
            background: white;
            padding: 25px;
            margin-bottom: 18px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border-left: 5px solid #1976d2;
        }

        .notice-icon {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .notice-card h3 {
            color: #123b70;
            margin-bottom: 10px;
        }

        .date {
            color: #1976d2;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .description {
            color: #666;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }

            .header {
                padding: 15px;
            }
        }
    </style>

</head>

<body>

    <div class="header">

        <h1>🎓 Campus360</h1>

        <a href="/dashboard" class="back">
            ← Dashboard
        </a>

    </div>


    <div class="container">

        <div class="title">

            <h2>📢 College Notices</h2>

            <p>
                Latest college announcements and important information
            </p>

        </div>


        {% for record in records %}

        <div class="notice-card">

            <div class="notice-icon">
                📢
            </div>

            <h3>
                {{ record.title }}
            </h3>

            <div class="date">
                📅 {{ record.notice_date }}
            </div>

            <p class="description">
                {{ record.description }}
            </p>

        </div>

        {% endfor %}

    </div>

</body>

</html>
