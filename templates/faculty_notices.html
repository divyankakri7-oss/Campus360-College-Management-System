<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus360 - Faculty Notices</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
        }

        .header {
            background: #123b70;
            color: white;
            padding: 20px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
        }

        .back {
            background: white;
            color: #123b70;
            padding: 9px 18px;
            border-radius: 7px;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 1000px;
            margin: 35px auto;
            padding: 20px;
        }

        .title {
            margin-bottom: 25px;
        }

        .title h2 {
            color: #123b70;
            margin-bottom: 8px;
        }

        .title p {
            color: #666;
        }

        .notice-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .notice-icon {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .notice-card h3 {
            color: #123b70;
            margin-bottom: 10px;
        }

        .date {
            display: inline-block;
            background: #eaf2ff;
            color: #123b70;
            padding: 6px 10px;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .description {
            color: #666;
            line-height: 1.6;
        }

        .empty {
            background: white;
            padding: 35px;
            text-align: center;
            border-radius: 12px;
            color: #777;
        }

        @media (max-width: 600px) {
            .header {
                padding: 15px;
            }

            .container {
                padding: 15px;
            }
        }
    </style>

</head>

<body>

    <div class="header">

        <h1>🎓 Campus360</h1>

        <a href="/faculty_dashboard" class="back">
            ← Dashboard
        </a>

    </div>


    <div class="container">

        <div class="title">

            <h2>📢 College Notices</h2>

            <p>
                View and manage college announcements
            </p>

        </div>


        {% if records %}

            {% for record in records %}

            <div class="notice-card">

                <div class="notice-icon">
                    📢
                </div>

                <h3>
                    {{ record.title }}
                </h3>

                <div class="date">
                    📅 {{ record.notice_date }}
                </div>

                <p class="description">
                    {{ record.description }}
                </p>

            </div>

            {% endfor %}

        {% else %}

        <div class="empty">

            <h3>No Notices Available</h3>

            <p>
                College notices will appear here.
            </p>

        </div>

        {% endif %}

    </div>

</body>

</html>
