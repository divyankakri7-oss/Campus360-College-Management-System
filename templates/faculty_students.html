<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus360 - Students</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
        }

        .header {
            background: #123b70;
            color: white;
            padding: 20px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
        }

        .back {
            background: white;
            color: #123b70;
            padding: 9px 18px;
            border-radius: 7px;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 20px;
        }

        .title {
            margin-bottom: 25px;
        }

        .title h2 {
            color: #123b70;
            margin-bottom: 8px;
        }

        .title p {
            color: #666;
        }

        .student-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .student-card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .student-top {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 18px;
        }

        .avatar {
            width: 55px;
            height: 55px;
            background: #123b70;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .student-top h3 {
            color: #123b70;
            margin-bottom: 5px;
        }

        .role {
            color: #777;
            font-size: 13px;
        }

        .email {
            color: #555;
            margin-bottom: 18px;
        }

        .view-btn {
            display: inline-block;
            background: #123b70;
            color: white;
            padding: 9px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
        }

        .view-btn:hover {
            background: #0d2d56;
        }

        .empty {
            background: white;
            padding: 35px;
            text-align: center;
            border-radius: 12px;
            color: #777;
        }

        @media (max-width: 700px) {
            .student-grid {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 15px;
            }

            .container {
                padding: 15px;
            }
        }
    </style>

</head>

<body>

    <div class="header">

        <h1>🎓 Campus360</h1>

        <a href="/faculty_dashboard" class="back">
            ← Dashboard
        </a>

    </div>


    <div class="container">

        <div class="title">

            <h2>👨‍🎓 Students</h2>

            <p>
                View all registered students
            </p>

        </div>


        {% if records %}

        <div class="student-grid">

            {% for student in records %}

            <div class="student-card">

                <div class="student-top">

                    <div class="avatar">
                        👨‍🎓
                    </div>

                    <div>
                        <h3>{{ student.name }}</h3>
                        <span class="role">Student</span>
                    </div>

                </div>

                <p class="email">
                    📧 {{ student.email }}
                </p>

                <a href="/faculty_student/{{ student.id }}"
                   class="view-btn">
                    View Profile →
                </a>

            </div>

            {% endfor %}

        </div>

        {% else %}

        <div class="empty">
            <h3>No Students Found</h3>
            <p>Registered students will appear here.</p>
        </div>

        {% endif %}

    </div>

</body>

</html>
