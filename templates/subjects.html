<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus360 - Subjects</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
        }

        .header {
            background: #123b70;
            color: white;
            padding: 20px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
        }

        .back {
            background: white;
            color: #123b70;
            padding: 9px 18px;
            border-radius: 7px;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 20px;
        }

        .title {
            margin-bottom: 25px;
        }

        .title h2 {
            color: #123b70;
            margin-bottom: 8px;
        }

        .title p {
            color: #666;
        }

        .subjects {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .subject-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .subject-icon {
            font-size: 35px;
            margin-bottom: 12px;
        }

        .subject-card h3 {
            color: #123b70;
            margin-bottom: 12px;
        }

        .subject-card p {
            color: #666;
            margin: 7px 0;
        }

        .code {
            display: inline-block;
            background: #eaf2ff;
            color: #1976d2;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
        }

        @media (max-width: 650px) {
            .subjects {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 15px;
            }
        }
    </style>

</head>

<body>

    <div class="header">

        <h1>🎓 Campus360</h1>

        <a href="/dashboard" class="back">
            ← Dashboard
        </a>

    </div>


    <div class="container">

        <div class="title">

            <h2>📚 My Subjects</h2>

            <p>
                View your semester subjects and faculty details
            </p>

        </div>


        <div class="subjects">

            {% for record in records %}

            <div class="subject-card">

                <div class="subject-icon">
                    📖
                </div>

                <h3>
                    {{ record.subject_name }}
                </h3>

                <span class="code">
                    {{ record.subject_code }}
                </span>

                <p>
                    <strong>Faculty:</strong>
                    {{ record.faculty }}
                </p>

            </div>

            {% endfor %}

        </div>

    </div>

</body>

</html>
