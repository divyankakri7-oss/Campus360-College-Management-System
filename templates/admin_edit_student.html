<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Student - Campus360</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
}

.header{
    background:#1e3a8a;
    color:white;
    padding:20px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h1{
    font-size:25px;
}

.back{
    background:white;
    color:#1e3a8a;
    text-decoration:none;
    padding:10px 18px;
    border-radius:8px;
    font-weight:bold;
}

.container{
    max-width:600px;
    margin:50px auto;
    padding:20px;
}

.card{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 18px rgba(0,0,0,0.08);
}

.card h2{
    color:#1e3a8a;
    margin-bottom:25px;
}

label{
    display:block;
    margin:15px 0 7px;
    font-weight:bold;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #d5d9e2;
    border-radius:8px;
    font-size:15px;
}

.update-btn{
    margin-top:25px;
    width:100%;
    padding:13px;
    background:#1e3a8a;
    color:white;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.update-btn:hover{
    background:#162d6b;
}

</style>

</head>


<body>


<div class="header">

    <h1>🎓 Campus360 Admin</h1>

    <a href="/admin_students" class="back">
        ← Students
    </a>

</div>


<div class="container">

    <div class="card">

        <h2>✏️ Edit Student</h2>


        <form method="POST">

            <label>
                Student Name
            </label>

            <input
                type="text"
                name="name"
                value="{{ student.name }}"
                required
            >


            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                value="{{ student.email }}"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                value="{{ student.password }}"
                required
            >


            <button
                type="submit"
                class="update-btn"
            >
                Update Student
            </button>

        </form>

    </div>

</div>


</body>

</html>
